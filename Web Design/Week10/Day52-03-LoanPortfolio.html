<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Welcome to Loan portfolio management!</h1>
    <br><br>
    <table class="table table-success">
        <tr>
            <td>Enter the amount to take loan:</td>
            <td><input id="amount" type="text"></input></td>
        </tr>
        <tr>
            <td>Enter the number of years to borrow:  </td>
            <td><input id="years" type="text"></input></td>
        </tr>
    </table>
    <h5 style="display: flex;justify-content: center;">The rate of interest is 4% !!</h5>
    <br>
    <button onclick="doit()"style="margin-left: 650px;"class="btn btn-success">Show Portfolio for this status</button>
    <br><br>
    <table class ="table table-secondary" id="displaytable">
        <th>SNO</th>
        <th>Loan Left</th>
        <th>EMI</th>
        <th>Principle</th>
        <th>Interest</th>
        <th>Remaining</th>
    </table>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <script>
        function doit(){
        var principle = document.getElementById("amount");
var years = document.getElementById("years");

        let P = Number(principle.value);
        let months = Number(years.value) * 12;
        var table = document.getElementById("displaytable");
        let r = 0.04 / 12;
        let monthlyamt = (P * r * Math.pow(1+r, months)) / (Math.pow(1+r, months) - 1);
        let remaining = P;
        table.innerHTML = `
        <tr>
        <th>SNO</th>
        <th>Loan Left</th>
        <th>EMI</th>
        <th>Principle</th>
        <th>Interest</th>
        <th>Remaining</th>
        </tr>
        `;
        for (let i = 1; i <= months; i++) {
            let Interest = remaining * r;
            let Principl = monthlyamt - Interest;
            table.innerHTML += `<tr>
            <td>${i}</td>
            <td>${remaining.toFixed(2)}</td>
            <td>${monthlyamt.toFixed(2)}</td>
            <td>${Principl.toFixed(2)}</td>
            <td>${Interest.toFixed(2)}</td>
            <td>${(remaining - Principl).toFixed(2)}</td>
            </tr>`;
            remaining = remaining - Principl;
        }
    }
     </script>
</body>
</html>
