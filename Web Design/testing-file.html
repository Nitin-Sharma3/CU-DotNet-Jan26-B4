<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanForm</title>
</head>
<body>
    <h1>Welcome to Loan Services:</h1>
    <form>
    <table>
        <tr>
            <td>Enter You Name:</td>
            <td><input type="text" id="cname" name="cname"
                pattern = "[A-Z]{1}[a-z]{1,}"
                required/></td>
            </tr>
            <tr>
                <td>Select Gender:</td>
                <td>
                    <input type="radio" name="gender" id="male" value="m" required/><label for="male">Male</label>
                    <input type="radio" name="gender" id="female" value="f" required/><label for="female">Female</label>
                </td>
            </tr>
            <tr>
                <td>Select Address:</td>
            <td>
                <select id="address" name="address" required>
                    <option value="">Select</option>
                    <option value ="1">Himachal Pradesh</option>
                    <option value="2">Delhi</option>
                    <option value="3">Bangalore</option>
                    <option value="4">Chandigarh</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Select loan amount:</td>
            <td>
                <input type="number" min="4999" max="300000"/>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                
                <input type="submit">
                <input type="reset"/>
            </td>
        </tr>
    </table>
    <form/>
    
</body>
</html>
